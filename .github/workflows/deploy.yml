name: Deploy to Hostinger

on:
  push:
    branches: [main]
  # Weekly rebuild so the exchange rates baked into the site stay fresh.
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The Hostinger secrets live in this GitHub environment (repo Settings > Environments).
    environment:
      name: HOSTINGER_HOST
      url: https://yayasansaintlusiaangello.org/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # Environment secrets, values from hPanel > Advanced > SSH Access:
      # HOSTINGER_HOST (IP), HOSTINGER_PORT (65002), HOSTINGER_USER (u123456789), HOSTINGER_SSH_KEY (private key).
      - name: Upload to public_html
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # --delete removes files of older builds; .well-known holds the SSL certificate checks, so it stays.
          rsync -rlz --delete --exclude '.well-known/' \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT" \
            dist/ "$USER@$HOST:domains/yayasansaintlusiaangello.org/public_html/"
